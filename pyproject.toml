[project]
name = "proton-pulse-web"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.5.0",
    "requests>=2.32.0",
    # VRDB ingest (#246) parses YAML frontmatter out of the upstream markdown
    # files. Runtime, not dev-only: scripts/pipeline/vrdb.py runs in the
    # pipeline. Was already present as a dev dep for the workflow-gate tests.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pylint>=3.3.8",
    "pyright>=1.1.403",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    # tests/test_staging_workflow_gates.py parses workflow YAML; without this
    # a fresh `uv sync` venv fails pytest collection with ModuleNotFoundError.
    "pyyaml>=6.0",
]

[tool.uv]
# Dependency cooldown: refuse to resolve any package version published in
# the last 7 days so a just-published malicious release cannot land in a
# fresh `uv sync` before supply-chain scanners flag it. Exact key Semgrep's
# uv-missing-dependency-cooldown rule looks for. Requires uv >= 0.9.17.
exclude-newer = "7 days"
# Security exception to the cooldown, one package, fixed date: certifi
# 2026.10.19 removes the emSign roots whose intermediate keys were
# compromised (GHSA-6q48-6c7w-9gw2, critical). It was 3 days old when the
# advisory landed, so the 7-day window hid the fix. The cutoff admits
# 2026.10.19 but not anything newer. Delete this line after 2026-10-27,
# when the normal window covers it.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts/pipeline --cov-fail-under=90"

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "duplicate-code",
    "global-statement",
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "line-too-long",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "subprocess-run-check",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "unnecessary-lambda",
    "unused-variable",
]
