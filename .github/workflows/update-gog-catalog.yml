name: Update GOG Catalog

on:
  schedule:
    - cron: "0 3 * * 0"  # weekly, Sunday 3am UTC
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force re-fetch even if cache is fresh"
        type: boolean
        default: false
      # Standardized inputs (#218).
      issue_id:
        description: "GitHub issue to comment run summary back on (leave blank to skip)"
        required: false
        default: ""
      dry_run:
        description: "Skip cache writes; log what would change"
        type: boolean
        default: false

jobs:
  update-gog-catalog:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout gh-pages for existing catalog cache
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-data
          fetch-depth: 1
        continue-on-error: true

      - name: Seed catalog cache from gh-pages
        run: |
          mkdir -p .cache
          bash scripts/seed-catalog-cache.sh gh-pages-data .cache gog-catalog-cache.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Fetch GOG catalog
        run: uv run python scripts/fetch_gog_catalog.py
        env:
          # A scheduled run exists to refresh the catalog, so it must not
          # ask the cache for permission. The cron cadence (weekly) equals
          # GOG/Epic CATALOG_CACHE_MAX_AGE (7 days), so the scheduled run kept
          # finding the cache a few hours short of expiry and doing nothing:
          #   [gog-catalog] loaded 8,053 entries from cache (age 147.1h)
          #   Cache unchanged, nothing to commit
          # The copy on gh-pages then went stale ~a day later and stayed that
          # way until the next weekly run, so every finalize in between paid
          # the full re-fetch (~134s GOG, ~140s Epic) and threw it away.
          FORCE_REFRESH: ${{ inputs.force_refresh == true || github.event_name == 'schedule' }}

      - name: Commit catalog cache to gh-pages
        if: inputs.dry_run != true
        run: |
          cd gh-pages-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase origin gh-pages
          cp ../.cache/gog-catalog-cache.json .
          git add gog-catalog-cache.json
          git diff --cached --quiet && echo "Cache unchanged, nothing to commit" || git commit -m "chore: refresh GOG catalog cache $(date +%F)"
          git push origin gh-pages

      - name: Back-comment run summary on issue
        if: always()
        uses: ./.github/actions/back-comment-run
        with:
          issue_id: ${{ inputs.issue_id }}
          status: ${{ job.status }}
          workflow_name: update-gog-catalog
          dry_run: ${{ inputs.dry_run }}
