name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 03:00 UTC - catches regressions even without a push.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  test-python:
    runs-on: ubuntu-24.04
    # Bumped 15 -> 30 min: test_finalize_output_* integration tests each
    # exercise the whole finalize pipeline against tmp_path and take 3-4
    # min apiece. Runs 30965592389 + 30979361544 both hit 36% after ~15
    # min and got killed. 30 min gives comfortable headroom for the
    # current suite and near-future growth; if the total ever creeps
    # back toward the limit, split the slow integration tests out into
    # their own job or mark them @pytest.mark.slow and skip in CI.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Python tests
        run: make test-py
