name: Build Site Data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      staging_with_pipeline:
        description: "Run the FULL pipeline against the staging branch and deploy data + shell to staging.proton-pulse.com. Slow (30+ min). Use when a pipeline-data change needs end-to-end verification before promoting to prod (#117)."
        required: false
        default: false
        type: boolean
      staging_with_finalize:
        description: "Skip probe + build, restore prod chunk state from R2, re-run only finalize + stats, deploy to staging.proton-pulse.com. Fast (~5 min) verification path for changes that only touch finalize.py or search-index shape (#196)."
        required: false
        default: false
        type: boolean
      resume:
        description: "Only re-run chunks marked incomplete in the R2 state chunk manifest (_state/pipeline-state/manifest.json). Rescue path for a partial run (e.g. chunk 8 stalled while 1-7 + 9-10 completed) -- avoids re-doing the successful work. #171 Phase 3."
        required: false
        default: false
        type: boolean
      finalize_only:
        description: "Skip probing entirely and re-run finalize against whatever chunk state is already in R2 state (_state/pipeline-state/). Use when a finalize-side bug needs a fix but the probe cache is fine. #171 Phase 3."
        required: false
        default: false
        type: boolean
      # Standardized inputs (#218): every workflow accepts issue_id + dry_run
      # for a common back-comment + preview-only story.
      issue_id:
        description: "GitHub issue to comment run summary back on (leave blank to skip)"
        required: false
        default: ""
      dry_run:
        description: "Preview: run stages that read but skip commits + Supabase writes (best-effort per stage)"
        type: boolean
        default: false
      deploy_target:
        description: "Where to publish the built site. 'cloudflare' (default) syncs data/ to R2 and deploys the shell to Cloudflare Pages. 'ghpages' is retained as a prod-only rollback path -- the origin cert saga and 20k-file Pages cap made it obsolete (#362)."
        required: false
        default: "cloudflare"
        type: choice
        options:
          - cloudflare
          - ghpages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  PROTONDB_PROBE_LIMIT: "5000"
  PROTONDB_PROBE_BACKFILL_LIMIT: "0"
  PROTONDB_PROBE_LOG_EVERY: "100"

jobs:

  # ── Stage 1: process reports, backfill, compute probe plan ─────────
  build:
    # finalize_only skips build entirely -- we're re-running the finalize
    # stage against the R2 chunk state as-is, no need to re-shard/re-probe.
    if: inputs.finalize_only != true && inputs.staging_with_finalize != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      chunk_count: ${{ steps.plan.outputs.chunk_count }}
      chunk_matrix: ${{ steps.plan.outputs.chunk_matrix }}
      expected_matrix: ${{ steps.plan.outputs.expected_matrix }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout Official ProtonDB Data
        uses: actions/checkout@v7
        with:
          repository: bdefore/protondb-data
          path: official-data
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Restore pipeline cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Write local .env from secret
        run: |
          if [ -n "${{ secrets.STEAM_API_KEY }}" ]; then
            printf 'STEAM_API_KEY=%s\n' "${{ secrets.STEAM_API_KEY }}" > .env
            echo "[steam-catalog] .env written from GitHub secret"
          else
            echo "[steam-catalog] STEAM_API_KEY secret not available"
          fi

      - name: Process Official Reports
        run: |
          mkdir -p /tmp/protondb-output
          uv run python scripts/split_reports.py process \
            official-data/reports \
            /tmp/protondb-output

      - name: Seed official dump provenance metadata
        run: |
          uv run python scripts/split_reports.py seed-official-metadata \
            official-data/reports \
            /tmp/protondb-output

      - name: Backfill Missing Apps
        run: |
          uv run python scripts/split_reports.py backfill \
            /tmp/protondb-output

      # Also starts this run's chunk-state manifest in the env's R2 state
      # (#171, #396). The R2 keys are scoped to this step.
      - name: Build probe chunk plan
        id: plan
        env:
          RESUME_MODE: ${{ inputs.resume }}
          RUN_ID: ${{ github.run_id }}
          STATE_BASE: ${{ inputs.staging_with_pipeline == true && 'https://staging-data.proton-pulse.com/_state' || 'https://data.proton-pulse.com/_state' }}
          R2_BUCKET: ${{ inputs.staging_with_pipeline == true && 'proton-pulse-data-staging' || 'proton-pulse-data' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          uv run python scripts/split_reports.py probe-plan /tmp/protondb-output > /tmp/probe-plan.json
          bash scripts/probe-plan-emit.sh /tmp/probe-plan.json

      - name: Save pipeline cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-build

      - name: Upload probe input artifact
        uses: actions/upload-artifact@v7
        with:
          name: probe-input
          path: |
            /tmp/protondb-output/data
            /tmp/protondb-output/pipeline-state.json

  # ── Stage 2: probe ProtonDB summaries in chunks ────────────────────
  probe-chunks:
    needs: build
    if: needs.build.outputs.chunk_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      # Chunk state goes to R2 now (#396), so no write access to the repo.
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: ${{ fromJson(needs.build.outputs.chunk_matrix) }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Download probe input artifact
        uses: actions/download-artifact@v8
        with:
          name: probe-input
          path: /tmp/protondb-output

      - name: Restore pipeline cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-chunk-${{ matrix.chunk }}
          restore-keys: |
            pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Write local .env from secret
        run: |
          if [ -n "${{ secrets.STEAM_API_KEY }}" ]; then
            printf 'STEAM_API_KEY=%s\n' "${{ secrets.STEAM_API_KEY }}" > .env
          fi

      # Phase 4 of #171: idempotent skip. If the current probe cache
      # hashes to the same input_sha this chunk stored last time, the
      # state hasn't drifted -- probe would be a no-op. Skip it. Warm
      # reruns of the same dispatch (accidental double-trigger, resume
      # of an already-complete plan) become near-instant.
      - name: Idempotent check (#171 Phase 4)
        id: idem
        env:
          STATE_BASE: ${{ inputs.staging_with_pipeline == true && 'https://staging-data.proton-pulse.com/_state' || 'https://data.proton-pulse.com/_state' }}
        run: bash scripts/probe-idempotent-check.sh "${{ matrix.chunk }}"

      - name: Probe ProtonDB summary chunk ${{ matrix.chunk }}
        if: steps.idem.outputs.skip != 'true'
        run: |
          uv run python scripts/split_reports.py probe /tmp/protondb-output

      # Phase 1 of #171: durable chunk-state persistence. Snapshot the probe
      # cache + a manifest entry to the env's R2 state (#396) so a cancelled
      # run (chunk timeout, runner starvation) doesn't throw away the
      # successful chunks' work. Only after a successful probe: under
      # always() a failed probe was recorded as completed, and a resume then
      # skipped it. Skipped when the idempotent check fired, nothing changed.
      - name: Persist chunk state to R2 (#171)
        if: steps.idem.outputs.skip != 'true'
        env:
          R2_BUCKET: ${{ inputs.staging_with_pipeline == true && 'proton-pulse-data-staging' || 'proton-pulse-data' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/persist-chunk-state.sh "${{ matrix.chunk }}" "${{ github.run_id }}" "${{ github.run_attempt }}"

      - name: Save pipeline cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-chunk-${{ matrix.chunk }}

  # ── Stage 3: finalize, build site, deploy to gh-pages ──────────────
  finalize:
    needs: [build, probe-chunks]
    if: |
      always() &&
      (inputs.finalize_only == true ||
        inputs.staging_with_finalize == true ||
        (needs.build.result == 'success' &&
         (needs.probe-chunks.result == 'success' || needs.probe-chunks.result == 'skipped')))
    # Shared with .github/workflows/publish-shell.yml so a slow finalize can
    # never deploy concurrently with (or on top of) a fast shell push. Group
    # keys on the CF Pages project the finalize will actually target, which
    # depends on the staging_with_* inputs -- NOT on github.ref_name -- so a
    # main-dispatched pipeline with staging_with_finalize=true still shares
    # the staging group. cancel-in-progress: false = queue behind whatever is
    # running; the version-check inside publish-cloudflare.sh is the second
    # safety net if the pipeline's checkout is stale.
    concurrency:
      group: cf-pages-${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'proton-pulse-web-staging' || 'proton-pulse-web' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Staging runs deploy to Cloudflare only. The gh-pages path for them
      # pushed to the retired proton-pulse-web-staging repo (#396), so a
      # staging + ghpages dispatch would build everything and publish nothing.
      - name: Refuse ghpages for staging runs
        if: (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && inputs.deploy_target == 'ghpages'
        run: |
          echo "::error::deploy_target=ghpages is prod-only. Staging runs deploy to Cloudflare (staging.proton-pulse.com)."
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      # finalize_only + staging_with_finalize both skip the build stage, so no
      # fresh artifact exists on this run. Skip the download in those modes and
      # let the gh-pages merge step below seed /tmp/protondb-output entirely
      # from the durable prod state -- exactly what we want when we're only
      # verifying a finalize / search-index shape change.
      - name: Download probe input artifact
        if: inputs.finalize_only != true && inputs.staging_with_finalize != true
        uses: actions/download-artifact@v8
        with:
          name: probe-input
          path: /tmp/protondb-output

      # Start from the previous run's data/ so probe-backfill can skip apps
      # that were already covered. Without it the artifact only carries the
      # small dump+manifest set (~8K apps), so every app probe-backfilled in
      # earlier runs looks "missing" and gets re-fetched (4+ hour stall). See
      # wiki Data-Pipeline.md "Known Issue".
      #
      # #396: the base is now data-snapshot.tar.zst in R2 state, pushed after
      # every Cloudflare deploy below. It used to be gh-pages' data/, which
      # nothing has written since the Cloudflare move (last change
      # 2026-09-20), so every nightly rebuilt from that stale copy. gh-pages
      # stays checked out only as the fallback until the first snapshot
      # exists. The seven cache copies that used to follow were dropped: the
      # Actions probe-cache restore below overwrites every one of them, and
      # game-images.json / game-images-skip.json are only read by a one-time
      # legacy migration when the image cache is empty.
      - name: Checkout current gh-pages (fallback base, chunk state)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-data
          fetch-depth: 1
        continue-on-error: true

      - name: Merge the previous data/ snapshot into probe input
        env:
          SNAPSHOT_COUNT_FILE: ${{ runner.temp }}/data-snapshot-count
        run: bash scripts/data-snapshot.sh pull /tmp/protondb-output gh-pages-data

      # main's cache is tried first (#258). On main that is the same prefix
      # as before. On staging it means previews start from prod's warm caches
      # (~30k Steam descriptors, every probe cache) instead of staging's own
      # cold one, which re-fetched tens of thousands of apps per run, got
      # Steam-rate-limited, ran 45-90 min and published adult games unflagged.
      # Other branches can read main's caches but never write them.
      - name: Restore pipeline cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            pipeline-cache-${{ runner.os }}-${{ github.workflow }}-main-
            pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-

      # The gh-pages seed above is frozen at 2026-08-23 since the Cloudflare
      # deploy stopped writing back to gh-pages (#258). Overlay the previous
      # run's probe caches from the Actions cache so they are not re-probed
      # from scratch every night. Falls back to the gh-pages seed if the
      # Actions cache was evicted.
      - name: Restore probe caches from previous run
        run: bash scripts/probe-cache-sync.sh restore .cache /tmp/protondb-output

      # Phase 2 of #171: source the probe cache from durable R2 state (#396)
      # instead of the ephemeral actions cache. Read keyless over the data
      # host: staging finalize-only runs read prod's state on purpose, staging
      # pipeline runs read the staging state their own chunks wrote. Overwrites .cache/protondb-
      # summary-probe-cache.json with the last chunk's snapshot. Aborts loud
      # if any chunk in the FULL plan (expected_matrix) is missing so a
      # runner starvation event surfaces here instead of silently finalizing
      # on stale data. In finalize_only mode build was skipped so the script
      # falls back to whatever's in manifest.json (empty arg triggers that
      # branch). Skipped if the full plan is empty (chunk_count == 0).
      - name: Restore chunk state from R2 (#171)
        if: inputs.finalize_only == true || inputs.staging_with_finalize == true || needs.build.outputs.chunk_count != '0'
        env:
          STATE_BASE: ${{ inputs.staging_with_pipeline == true && 'https://staging-data.proton-pulse.com/_state' || 'https://data.proton-pulse.com/_state' }}
        run: bash scripts/restore-chunk-state.sh '${{ needs.build.outputs.expected_matrix }}'

      # Seed the store catalog caches AFTER restoring the pipeline cache, so
      # the freshly rebuilt catalog (pushed by the dedicated GOG/Epic
      # workflows) wins over a stale copy carried in the actions cache. Doing
      # this before the restore let the old catalog clobber the new one, which
      # silently froze the GOG/Epic search-index stubs at an outdated count.
      # #396: the weekly workflows push to R2 state now. Read it over the
      # public data host (no keys, same for staging), fall back to the
      # gh-pages copy until the first weekly run has filled R2, then let
      # seed-catalog-cache.sh keep whichever copy has the newer _ts.
      - name: Seed store catalog caches from R2 state
        run: |
          mkdir -p .cache
          bash scripts/fetch-public-state.sh "$RUNNER_TEMP/catalog-state" gh-pages-data \
            gog-catalog-cache.json epic-catalog-cache.json
          bash scripts/seed-catalog-cache.sh "$RUNNER_TEMP/catalog-state" .cache \
            gog-catalog-cache.json epic-catalog-cache.json

      # #89: log which caches survived the restore, their sizes + ages,
      # so the workflow output tells us at a glance whether the two cache
      # layers are actually doing their job. Prints one line per known
      # cache file with entries / bytes / age-in-days.
      - name: Cache-state stats (#89)
        run: bash scripts/log-cache-stats.sh post-restore

      - name: Write local .env from secret
        run: |
          if [ -n "${{ secrets.STEAM_API_KEY }}" ]; then
            printf 'STEAM_API_KEY=%s\n' "${{ secrets.STEAM_API_KEY }}" > .env
          fi

      # finalize_only + staging_with_finalize skip probing entirely, so there
      # are no newly-probed discoveries to reconcile. Skip this step in those
      # modes (it needs pipeline-state.json from the artifact, which isn't
      # generated on these paths).
      - name: Backfill Probe Discoveries
        if: inputs.finalize_only != true && inputs.staging_with_finalize != true
        run: |
          uv run python scripts/split_reports.py probe-backfill \
            /tmp/protondb-output

      # Synthesize pipeline-state.json from disk when the artifact is absent
      # (finalize_only + staging_with_finalize). Walks /tmp/protondb-output/data
      # for (app_id, year) tuples so finalize's read_pipeline_state has real
      # index_keys to iterate. Other fields are empty since there's no new
      # probing on these paths.
      - name: Synthesize pipeline-state from disk
        if: inputs.finalize_only == true || inputs.staging_with_finalize == true
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/protondb-output")
          data = root / "data"
          keys = []
          if data.is_dir():
              for app_dir in data.iterdir():
                  if not app_dir.is_dir():
                      continue
                  name = app_dir.name
                  # Reverse app_id_to_dir naming: gog_/epic_ prefixes become
                  # gog:/epic:; bare digits stay as-is.
                  if name.startswith("gog_"):
                      app_id = "gog:" + name[4:]
                  elif name.startswith("epic_"):
                      app_id = "epic:" + name[5:]
                  else:
                      app_id = name
                  for year_file in app_dir.glob("*.json"):
                      stem = year_file.stem
                      if stem in {"latest", "index", "votes", "metadata"}:
                          continue
                      keys.append([app_id, stem])
          state = {"parsed_count": 0, "index_keys": keys, "backfilled_keys": [], "no_data_app_ids": []}
          out = root / "pipeline-state.json"
          out.write_text(json.dumps(state, indent=2) + "\n")
          print(f"[synthesized-state] wrote {len(keys)} index_keys to {out}")
          PY

      - name: Finalize (Indexes + Coverage)
        env:
          # game_images.py falls through to SteamGridDB when Steam's
          # own APIs yield no header URL. Key is optional -- pipeline
          # tags the row "missing" cleanly if unset.
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          # Anon key + URL let game_images.py fetch admin overrides
          # (box_art_overrides table) via the anon-readable REST
          # endpoint. Optional -- if unset the pipeline runs as before
          # without seeding overrides.
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # #434: search API sync step at end of finalize needs the
          # service-role key to upsert into search_index (RLS-locked
          # against anon writes). Falls back to skip when unset.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # #387: PCGamingWiki bot password (Special:BotPasswords under the
          # owner's SSO account, Basic rights only -- PCGW staff confirmed
          # this is the supported API auth). Either unset = anonymous reads,
          # which PCGW also allows. Auth does not change the 30 req/min
          # per-IP limit; pcgamingwiki.py paces for that regardless.
          PCGAMINGWIKI_BOT_USER: ${{ secrets.PCGAMINGWIKI_BOT_USER }}
          PCGAMINGWIKI_BOT_PASS: ${{ secrets.PCGAMINGWIKI_BOT_PASS }}
        run: |
          uv run python scripts/split_reports.py finalize --skip-probe \
            /tmp/protondb-output

      - name: Hardware suggestions (PCI IDs)
        run: uv run python scripts/pipeline/hardware_suggestions.py

      - name: Approve pending reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python scripts/pipeline/approve_reports.py

      - name: Copy catalog caches to output
        run: |
          cp .cache/gog-catalog-cache.json /tmp/protondb-output/ 2>/dev/null || true
          cp .cache/epic-catalog-cache.json /tmp/protondb-output/ 2>/dev/null || true

      - name: Persist probe caches for the next run
        if: always()
        run: bash scripts/probe-cache-sync.sh save .cache /tmp/protondb-output

      - name: Save pipeline cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: pipeline-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-final

      # Preserved unconditionally, before either deploy path runs: the
      # gh-pages orphan deploy below (`git rm -rf .`) deletes every tracked
      # file, backup-to-release.sh included, but the "Backup data to GitHub
      # Release" step needs it afterward regardless of which deploy path ran.
      #
      # Not hypothetical: every scheduled run from 2026-08-19 through 08-23
      # died here with "scripts/backup-to-release.sh: No such file or
      # directory" and the nightly data backup stopped for five days (#494).
      # It read as intermittent because cloudflare-target runs skip the orphan
      # step and so never hit the wipe. That is also why this cannot move
      # inside the orphan step next to the preserve-* copies -- the backup
      # runs on both targets, so a cp nested there would never fire on
      # cloudflare and would only relocate the failure.
      - name: Preserve backup script
        if: inputs.staging_with_pipeline != true && inputs.staging_with_finalize != true
        run: cp scripts/backup-to-release.sh /tmp/backup-to-release.sh

      # form-schema.json + scoring-info.json come from the plugin repo, not
      # the pipeline. Without them in /tmp/protondb-output the CF deploy below
      # ships prod without either file and the submit form breaks (#546). The
      # gh-pages curls further down only feed the legacy orphan deploy.
      - name: Fetch plugin-sourced data files
        if: (inputs.deploy_target || 'cloudflare') == 'cloudflare'
        run: bash scripts/fetch-plugin-data.sh /tmp/protondb-output

      # Cloudflare target (#362): sync data/ to R2 + deploy the shell to Pages.
      # Runs instead of the gh-pages orphan deploy when deploy_target=cloudflare.
      # Must come BEFORE the orphan step, which wipes the working tree. Staging
      # runs target the staging Pages project; everything else targets prod.
      #
      # inputs.deploy_target falls back to 'cloudflare' with `||` because the
      # `inputs` context (including declared `default:` values) is only
      # populated for workflow_dispatch/workflow_call triggers -- the nightly
      # `schedule:` trigger gets an empty inputs context, so without the
      # fallback this always evaluated to false on cron runs and silently fell
      # through to the legacy gh-pages orphan deploy below instead.
      - name: Deploy to Cloudflare (R2 + Pages)
        if: (inputs.deploy_target || 'cloudflare') == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PAGES_PROJECT: ${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'proton-pulse-web-staging' || 'proton-pulse-web' }}
          PAGES_BRANCH: ${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'staging' || 'main' }}
          # #380: staging + prod get separate R2 buckets so a staging sync
          # cannot overwrite prod data mid-flight. Staging bucket is bound
          # to staging-data.proton-pulse.com; prod bucket stays on
          # data.proton-pulse.com. publish-cloudflare.sh already reads
          # R2_BUCKET + DATA_BASE env vars.
          R2_BUCKET: ${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'proton-pulse-data-staging' || 'proton-pulse-data' }}
          DATA_BASE: ${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'https://staging-data.proton-pulse.com' || 'https://data.proton-pulse.com' }}
          # #392: content-hash delta sync. Driven by the R2_DELTA_SYNC repo
          # variable so rollout/rollback is a settings flip, not a commit.
          # Unset variable = '0' = full sync (the pre-#392 behavior). Each
          # bucket (staging/prod, split in #380) keeps its own manifest, so
          # the two targets delta independently.
          R2_DELTA_SYNC: ${{ vars.R2_DELTA_SYNC || '0' }}
          # Escape hatch for the R2 sync fan-out. Unset falls through to the
          # script's default (32). Set the repo variable to dial back without a
          # code change if R2 starts returning ServiceUnavailable at volume.
          R2_SYNC_CONCURRENCY: ${{ vars.R2_SYNC_CONCURRENCY || '' }}
        run: |
          bash scripts/publish-cloudflare.sh /tmp/protondb-output "$GITHUB_WORKSPACE"

      # #396: save this run's data/ as the next run's base. Only after a
      # successful Cloudflare deploy, into the same bucket the deploy used,
      # so a staging run never touches prod's snapshot. data-snapshot.sh
      # refuses to upload a data/ that shrank below 90% of the base it
      # started from.
      - name: Push data/ snapshot to R2 state
        if: (inputs.deploy_target || 'cloudflare') == 'cloudflare'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ (inputs.staging_with_pipeline == true || inputs.staging_with_finalize == true) && 'proton-pulse-data-staging' || 'proton-pulse-data' }}
          SNAPSHOT_COUNT_FILE: ${{ runner.temp }}/data-snapshot-count
        run: bash scripts/data-snapshot.sh push /tmp/protondb-output

      - name: Deploy to gh-pages (orphan, no history)
        if: inputs.staging_with_pipeline != true && inputs.staging_with_finalize != true && (inputs.deploy_target || 'cloudflare') != 'cloudflare'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Copy pipeline-helper scripts out of the workspace BEFORE the
          # `git rm -rf .` below wipes them. `git rm -rf .` deletes every
          # tracked file, including scripts/preserve-steam-type-cache.sh
          # which the deploy step needs to run later. Introduced by #263.
          cp scripts/preserve-steam-type-cache.sh /tmp/preserve-steam-type-cache.sh
          # Same reason: the cert monitor (#359) commits cert-status.json +
          # cert-history.json to gh-pages between pipeline runs. The orphan
          # rebuild would wipe them, losing the append-only burndown history.
          cp scripts/preserve-cert-monitor.sh /tmp/preserve-cert-monitor.sh
          git checkout --orphan gh-pages-new
          git rm -rf .
          cp -r /tmp/protondb-output/data .
          cp /tmp/protondb-output/data-index.html .
          cp /tmp/protondb-output/coverage.html .
          cp /tmp/protondb-output/search-index.json . 2>/dev/null || true
          cp /tmp/protondb-output/search-index-steam-extended.json . 2>/dev/null || true
          cp /tmp/protondb-output/coverage-summary.json . 2>/dev/null || true
          cp /tmp/protondb-output/stats.json . 2>/dev/null || true
          cp /tmp/protondb-output/recent-reports.json . 2>/dev/null || true
          cp /tmp/protondb-output/game-images.json . 2>/dev/null || true
          cp /tmp/protondb-output/game-images-skip.json . 2>/dev/null || true
          cp /tmp/protondb-output/game-images-cache.json . 2>/dev/null || true
          cp /tmp/protondb-output/nonsteam-images-cache.json . 2>/dev/null || true
          cp /tmp/protondb-output/release-years-cache.json . 2>/dev/null || true
          cp /tmp/protondb-output/gog-catalog-cache.json . 2>/dev/null || true
          cp /tmp/protondb-output/epic-catalog-cache.json . 2>/dev/null || true
          cp /tmp/protondb-output/most_played.json . 2>/dev/null || true
          cp /tmp/protondb-output/deck-status.json . 2>/dev/null || true
          cp /tmp/protondb-output/nonsteam-images.json . 2>/dev/null || true
          cp /tmp/protondb-output/nonsteam-metadata.json . 2>/dev/null || true
          cp /tmp/protondb-output/proton-versions.json . 2>/dev/null || true
          cp /tmp/protondb-output/data-versions.json . 2>/dev/null || true
          cp /tmp/protondb-output/steam-catalog.json . 2>/dev/null || true
          cp /tmp/protondb-output/hardware-suggestions.json . 2>/dev/null || true
          git show main:gh-pages-manifest.txt > gh-pages-manifest.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in \#*) continue ;; esac
            mkdir -p "$(dirname "$path")"
            git show main:"$path" > "$path" 2>/dev/null || true
          done < gh-pages-manifest.txt
          curl -sL https://raw.githubusercontent.com/mdeguzis/decky-proton-pulse/main/src/data/scoring-info.json -o scoring-info.json
          curl -sL https://raw.githubusercontent.com/mdeguzis/decky-proton-pulse/main/src/data/form-schema.json -o form-schema.json
          mkdir -p badges
          # Fetch Pulse count from Supabase (hardcoded URL + fixed field read).
          # Download to a temp file first, then parse -- avoids the curl|python3
          # pipe pattern that Semgrep's gha-curl-pipe-shell rule flags.
          curl -sf \
            -H "apikey: sb_publishable_3Oqhm4JneafJNQw9BuUaxw_L9qZa-5V" \
            -H "Prefer: count=exact" \
            "https://ilsgdshkaocrmibwdezk.supabase.co/rest/v1/user_configs?select=count" \
            > /tmp/pulse-count.json 2>/dev/null || echo '[{"count":0}]' > /tmp/pulse-count.json
          PULSE_COUNT=$(python3 -c "import json; print(json.load(open('/tmp/pulse-count.json'))[0]['count'])" 2>/dev/null || echo "0")
          printf '{"schemaVersion":1,"label":"Pulse reports","message":"%s","color":"informational"}\n' "$PULSE_COUNT" > badges/pulse-reports.json
          # Preserve steam-type-cache.json + column 11 across the force-push
          # (#263). Reads the current origin/gh-pages, copies the cache in,
          # and re-applies its types to the fresh search-index.json before
          # we commit. Silent no-op on first ever deploy.
          bash /tmp/preserve-steam-type-cache.sh "$(pwd)"
          # Carry the cert monitor's files (#359) over from the old gh-pages so
          # the orphan force-push does not drop the burndown history.
          bash /tmp/preserve-cert-monitor.sh "$(pwd)"
          [ -f cert-status.json ] && git add cert-status.json || true
          [ -f cert-history.json ] && git add cert-history.json || true
          git add data/ data-index.html coverage.html search-index.json scoring-info.json form-schema.json badges/
          # add optional pipeline outputs (skip silently if a fresh checkout
          # didn't have them yet, e.g. first run after introducing the file)
          for f in coverage-summary.json stats.json recent-reports.json game-images.json game-images-skip.json game-images-cache.json image-fallback-stats.json nonsteam-images-cache.json release-years-cache.json gog-catalog-cache.json epic-catalog-cache.json most_played.json deck-status.json proton-versions.json steam-catalog.json hardware-suggestions.json nonsteam-images.json nonsteam-metadata.json data-versions.json search-index-steam-extended.json app-id-redirects.json app-id-validation-cache.json steam-type-cache.json pcgamingwiki.json pcgamingwiki-cache.json pcgwiki-catalog.json pcgwiki-catalog-cache.json pcgw-id-map.json flightless-benchmarks.json flightless-review-queue.json flightless-benchmarks-cache.json vrdb.json vr-index.json; do
            [ -f "$f" ] && git add "$f"
          done
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in \#*) continue ;; esac
            git add "$path"
          done < gh-pages-manifest.txt
          VERSION=$(git show main:package.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('version','0.0.0'))")
          SHA=$(git rev-parse --short main)
          printf '{"version":"%s","sha":"%s","deployed_at":"%s","repo":"mdeguzis/proton-pulse-web"}\n' "$VERSION" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          git add version.json
          git commit -m "Deploy: $(date +%F)"
          git push origin gh-pages-new:gh-pages --force

      # NOTE: the production pipeline must NOT push to the staging site. Doing so
      # once force-pushed main's frontend over an in-review staging preview.
      # Staging's shell comes from publish-shell.yml on the staging branch.

      # Backup: tar the local pipeline output and upload to a rolling GitHub
      # Release (#393). Only on production runs -- staging does not need backups.
      # Replaces the old nightly backup-r2-snapshot cron that re-pulled 75k
      # objects from R2 just to tar them. This uses what is already on disk.
      - name: Backup data to GitHub Release
        if: inputs.staging_with_pipeline != true && inputs.staging_with_finalize != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash /tmp/backup-to-release.sh /tmp/protondb-output

  # ── Status report (runs even on failure) ───────────────────────────
  report-build-status:
    needs: [build, probe-chunks, finalize]
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      # Needed by the back-comment composite action.
      - uses: actions/checkout@v7

      - name: Summary
        env:
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_PROBE: ${{ needs.probe-chunks.result }}
          RESULT_FINALIZE: ${{ needs.finalize.result }}
        run: |
          echo "### Build Site Data" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | $RESULT_BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe chunks | $RESULT_PROBE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Finalize + Deploy | $RESULT_FINALIZE |" >> "$GITHUB_STEP_SUMMARY"

      # #218: back-comment on the target issue if the dispatch specified one.
      # Runs BEFORE the fail step so a failed run still posts a summary before
      # the job flips red.
      - name: Back-comment run summary on issue
        if: always()
        uses: ./.github/actions/back-comment-run
        with:
          issue_id: ${{ inputs.issue_id }}
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          workflow_name: update-data
          dry_run: ${{ inputs.dry_run }}

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
