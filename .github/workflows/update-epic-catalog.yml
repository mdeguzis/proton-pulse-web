name: Update Epic Catalog

on:
  schedule:
    - cron: "0 4 * * 0"  # weekly, Sunday 4am UTC
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force re-fetch even if cache is fresh"
        type: boolean
        default: false
      # Standardized inputs (#218). Every dispatchable workflow accepts these
      # so a bug report can be spot-fixed with a one-click dispatch that
      # comments the run summary back on the issue.
      issue_id:
        description: "GitHub issue to comment run summary back on (leave blank to skip)"
        required: false
        default: ""
      dry_run:
        description: "Skip cache writes; log what would change"
        type: boolean
        default: false

jobs:
  update-epic-catalog:
    runs-on: ubuntu-24.04
    # The cache lives in R2 state now (#396), so no gh-pages push and no
    # contents: write. issues: write is for the back-comment step. The R2
    # keys are set only on the pull and push steps, so uv sync and the
    # catalog fetch never see them.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pull catalog cache from R2 state
        run: bash scripts/catalog-state.sh pull .cache epic-catalog-cache.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The catalog is the same for every environment; prod's bucket
          # holds it and staging finalize reads it over the public data host.
          R2_BUCKET: proton-pulse-data

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Fetch Epic catalog
        run: uv run python scripts/fetch_epic_catalog.py
        env:
          # A scheduled run exists to refresh the catalog, so it must not
          # ask the cache for permission. The cron cadence (weekly) equals
          # GOG/Epic CATALOG_CACHE_MAX_AGE (7 days), so the scheduled run kept
          # finding the cache a few hours short of expiry and doing nothing:
          #   [gog-catalog] loaded 8,053 entries from cache (age 147.1h)
          #   Cache unchanged, nothing to commit
          # The copy on gh-pages then went stale ~a day later and stayed that
          # way until the next weekly run, so every finalize in between paid
          # the full re-fetch (~134s GOG, ~140s Epic) and threw it away.
          FORCE_REFRESH: ${{ inputs.force_refresh == true || github.event_name == 'schedule' }}

      - name: Push catalog cache to R2 state
        if: inputs.dry_run != true
        run: bash scripts/catalog-state.sh push .cache epic-catalog-cache.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The catalog is the same for every environment; prod's bucket
          # holds it and staging finalize reads it over the public data host.
          R2_BUCKET: proton-pulse-data

      - name: Back-comment run summary on issue
        if: always()
        uses: ./.github/actions/back-comment-run
        with:
          issue_id: ${{ inputs.issue_id }}
          status: ${{ job.status }}
          workflow_name: update-epic-catalog
          dry_run: ${{ inputs.dry_run }}
