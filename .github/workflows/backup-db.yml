name: Database Backup (encrypted)

# Nightly full logical dump of Supabase (every public table + auth accounts),
# encrypted to an age public key and stored in the private R2 backups bucket
# (#580). backup.yml's export is pseudonymized and partial; this is the one a
# restore actually uses. A failed run fails the workflow, and GitHub emails
# the owner for failed scheduled runs.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dump and encrypt, but skip the upload and prune"
        type: boolean
        default: false

concurrency:
  group: backup-db
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump, encrypt, upload
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/backup-db.sh
