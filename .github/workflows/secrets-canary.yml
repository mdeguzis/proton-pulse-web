name: Secrets Canary

# Proves every remaining secret-backed integration still authenticates, with
# one read-only call each: the Cloudflare API token, each Discord webhook, the
# Steam and SteamGridDB keys, the staging and backup repo PATs, and the
# optional OpenAI / VirusTotal keys (#383, #384). R2 and Supabase have their
# own canaries. REQUIRE_ALL=1 makes a deleted secret a failure. A failure is
# surfaced to #builds via Discord CI Status (this workflow's name is listed
# there); if the Discord webhook itself is what broke, GitHub's failed-run
# email still fires.

on:
  schedule:
    # Daily, after the R2 (07:00) and Supabase (08:00) canaries.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the script)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Canary every secret-backed integration
        env:
          REQUIRE_ALL: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_BUILDS: ${{ secrets.DISCORD_WEBHOOK_BUILDS }}
          DISCORD_WEBHOOK_BACKUPS: ${{ secrets.DISCORD_WEBHOOK_BACKUPS }}
          DISCORD_WEBHOOK_ISSUES: ${{ secrets.DISCORD_WEBHOOK_ISSUES }}
          DISCORD_WEBHOOK_PULL_REQUESTS: ${{ secrets.DISCORD_WEBHOOK_PULL_REQUESTS }}
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: bash scripts/secrets-canary.sh
