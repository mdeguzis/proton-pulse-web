name: Edge Function Health

# Manual ping of every Supabase edge function this site uses (#254).
#
# The 15-minute schedule was removed (#519): the pp-edge-status Cloudflare
# Worker (workers/edge-status, 15-min Cron Trigger) serves the live status to
# /status.html and the topbar, and nothing reads a static edge-status.json any
# more (the status page's static fallback was dropped in the same change).
# Kept as workflow_dispatch for debugging the check script by hand. The result
# is printed to the log and nowhere else; it stopped being committed to
# gh-pages in #396.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-fn-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for the script)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ping every edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/check-edge-fn-health.sh "$RUNNER_TEMP/edge-status.json"
          cat "$RUNNER_TEMP/edge-status.json"
