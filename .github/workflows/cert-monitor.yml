name: Cert Monitor

# Reads the TLS certificate served on the live site (www.proton-pulse.com) every
# 6 hours and writes cert-status.json + cert-history.json (#359). Post-#362 the
# site is on Cloudflare Pages so this is the single CF-managed cert. The
# burndown graph on the status page is fed from these files.
#
# Where the files live: R2 state, `_state/` in the prod data bucket (#396).
# They used to be committed to gh-pages, which is being archived. The shell
# deploy (publish-cloudflare.sh, via preserve-cert-monitor.sh) copies them from
# there into the Pages deploy, because the status page reads them same-origin.
#
# Secrets: only the R2 keys the pipeline already uses. The cert itself is read
# with a plain public openssl handshake.

on:
  schedule:
    # Every 6 hours. The cert only changes on renewal (~every 60-90 days), so a
    # tight cadence buys nothing; 4x/day keeps days-remaining fresh and the
    # burndown graph smooth.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cert-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for the scripts)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the served cert + append history
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The cert checked is prod's, so the state is prod's.
          R2_BUCKET: proton-pulse-data
          STATE_DIR: ${{ runner.temp }}/cert-state
        run: |
          bash scripts/cert-monitor-state.sh pull "$STATE_DIR"
          bash scripts/cert-monitor.sh "$STATE_DIR/cert-status.json" "$STATE_DIR/cert-history.json"
          cat "$STATE_DIR/cert-status.json"
          bash scripts/cert-monitor-state.sh push "$STATE_DIR"
